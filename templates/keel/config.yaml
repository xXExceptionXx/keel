# keel-Projektkonfiguration. Anbieterwahl ist ein Projekt-ADR.
git:
  base_branch: main        # Basis für Vorhaben-Branches und Ziel der Integration, z. B. develop oder staging.
                           # Der Weg von dort nach main bleibt ein manueller Schritt.
  feature_prefix: feature/ # Branch pro Vorhaben: <feature_prefix><name>
  fix_prefix: fix/         # Branch pro Reparatur: <fix_prefix><ID>

test:
  command: npm test --silent       # Prüftor pro Aufgabe; Abnahmetests ausgenommen
  acceptance: npm test --silent    # Abnahmetests eines Vorhabens
  timeout: 480                     # Sekunden je Prüftor-Lauf; muss unter dem Hook-Timeout (600) bleiben

budget:
  tool_calls: 60           # Standard je Rollenlauf
  diff_lines: 300
  minutes: 30              # Meldeschwelle: darüber meldet der Lauf einmal budget_slow, gesperrt wird nicht
  # Je Rolle überschreibbar als <rolle>_<schlüssel>. Lesende Rollen brauchen mehr, in großen Repos deutlich mehr.
  architekt_tool_calls: 200
  architekt_minutes: 60
  auditor_tool_calls: 150
  auditor_minutes: 45
  coach_tool_calls: 150
  coach_minutes: 45
  po_tool_calls: 100
  planer_tool_calls: 100
  context_tokens: 100000   # Kontext-Alarm beim Lead ab so vielen Tokens, unabhängig vom Fenster des Modells

# Korridore der Lernschleife; Startwerte, der Coach schlägt Kalibrierungen vor. Format "min-max".
korridore:
  vorlagen_pro_woche: 2-5
  entscheidungsdauer_tage: 0-2
  gekippte_delegierte_adrs_prozent: 0-10
  gekippte_supervisor_entscheidungen_prozent: 0-15
  eskalationsquote_prozent: 10-40
  einwaende_bei_abweichung_prozent: 50-100  # Einwände, wenn der Mensch von der Empfehlung abweicht; niedrig heißt: redet nach dem Mund
  review_runden_pro_aufgabe: 1-2
  ruecklaufquote_review_prozent: 0-30
  fix_befunde_prozent: 0-20         # Nacharbeitsrunden, in denen die Nacharbeit neue Befunde erzeugt hat
  pflege_verfallen_prozent: 0-50    # hoch heißt: Anmerkungen sind Rauschen oder das Pflegebudget ist zu klein
  neuschnitt_quote_prozent: 0-20
  blockierte_uebergaben_prozent: 0-20
  budget_verstoesse: 0-0
  kontext_alarme: 0-0
  audit_abweichungen_pro_bericht: 0-3
  diff_zeilen_pro_aufgabe: 20-300
  tokens_pro_aufgabe_k: 0-400

# Review mit Schwelle (System-ADR 0018). Bestanden erst, wenn keine Zahl über ihrer Schwelle liegt.
# Weitere Runden nur, solange (blockierend, wichtig) sinkt; sonst Vorlage an den Supervisor.
review:
  schwelle_blockierend: 0
  schwelle_wichtig: 0
  max_runden: 4          # Sicherung; der Supervisor kann je Aufgabe Zusatzrunden geben

# Anmerkungen aus bestandenen Reviews sammelt die Pflegeliste; der Architekt sichtet sie in der Wochenrunde.
pflege:
  max_aufgaben_pro_runde: 2   # Pflegeaufgaben, die eine Wochenrunde höchstens vorschlägt
  verfall_tage: 42            # offene Einträge verfallen danach

supervisor:
  model: claude-fable-5-1   # Modell des Supervisors; das Briefing muss auf diesem Modell laufen, ein Hook prüft es

monitor:
  autostart: false          # true: /keel:start, vorhaben, epic, tagesstart, briefing, keel.sh und keel-run.sh starten den Ablauf-Monitor mit
  port: 8765                # http://127.0.0.1:<port>/; je Projekt ein eigener Port, wenn mehrere Monitore laufen

# Fälligkeiten, die /keel:start abarbeitet und die ein Hook bis dahin erzwingt. Nur bei genug Betrieb.
faelligkeiten:
  coach_tage: 30               # frühestens nach so vielen Tagen …
  coach_min_rollenlaeufe: 40   # … und nur, wenn seitdem so viele Rollenläufe stattfanden
  coach_nach_modellwechsel_rollenlaeufe: 10   # Modellwechsel: Coach vorgezogen, sobald so viele Läufe auf dem neuen Modell vorliegen
  architektur_tage: 7
  architektur_min_commits: 10
  wiedervorlage_ueberfaellig_tage: 7   # so viele Tage über dem Termin macht eine Wiedervorlage das Briefing hart fällig

compliance:
  pii_patterns: ""       # zusätzliche Muster, mit | getrennt, z. B. 'mitgliedsnummer|\bkundennummer\b'
                         # Reguläre Ausdrücke in einfache Anführungszeichen: dort gilt \ wörtlich.

backlog:
  provider: markdown   # markdown | github | linear
