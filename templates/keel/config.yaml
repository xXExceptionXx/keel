# keel-Projektkonfiguration. Anbieterwahl ist ein Projekt-ADR.
git:
  base_branch: main        # Basis für Vorhaben-Branches und Ziel der Integration, z. B. develop oder staging.
                           # Der Weg von dort nach main bleibt ein manueller Schritt.
  feature_prefix: feature/ # Branch pro Vorhaben: <feature_prefix><name>
  fix_prefix: fix/         # Branch pro Reparatur: <fix_prefix><ID>

test:
  command: npm test --silent       # Prüftor pro Aufgabe; Abnahmetests ausgenommen
  acceptance: npm test --silent    # Abnahmetests eines Vorhabens

budget:
  tool_calls: 60           # Standard je Rollenlauf
  diff_lines: 300
  minutes: 30
  # Je Rolle überschreibbar als <rolle>_<schlüssel>. Lesende Rollen brauchen mehr, in großen Repos deutlich mehr.
  architekt_tool_calls: 200
  architekt_minutes: 60
  auditor_tool_calls: 150
  auditor_minutes: 45
  coach_tool_calls: 150
  coach_minutes: 45
  po_tool_calls: 100
  planer_tool_calls: 100
  context_window: 200000   # Kontextfenster des Lead-Modells in Tokens
  context_percent: 50      # Kontext-Alarm ab diesem Anteil

# Korridore der Lernschleife; Startwerte, der Coach schlägt Kalibrierungen vor. Format "min-max".
korridore:
  vorlagen_pro_woche: 2-5
  entscheidungsdauer_tage: 0-2
  gekippte_delegierte_adrs_prozent: 0-10
  gekippte_supervisor_entscheidungen_prozent: 0-15
  eskalationsquote_prozent: 10-40
  einwaende_supervisor: 1-10       # zu niedrig heißt: redet nach dem Mund
  review_runden_pro_aufgabe: 1-2
  ruecklaufquote_review_prozent: 0-30
  neuschnitt_quote_prozent: 0-20
  blockierte_uebergaben_prozent: 0-20
  budget_verstoesse: 0-0
  kontext_alarme: 0-0
  audit_abweichungen_pro_bericht: 0-3
  diff_zeilen_pro_aufgabe: 20-300
  tokens_pro_aufgabe_k: 0-400

compliance:
  pii_patterns: ""       # zusätzliche Muster, mit | getrennt, z. B. "mitgliedsnummer|kundennummer"

backlog:
  provider: markdown   # markdown | github | linear
