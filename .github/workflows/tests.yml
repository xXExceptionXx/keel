name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: system
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}

      - name: Use the macOS system python and bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          ln -sf /bin/bash "$RUNNER_TEMP/shim/bash"
          if [ "${{ matrix.python }}" = system ]; then ln -sf /usr/bin/python3 "$RUNNER_TEMP/shim/python3"; fi
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          echo "KEEL_TEST_BASH=/bin/bash" >> "$GITHUB_ENV"

      - name: Tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version
          git --version

      - name: Git identity for fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Unit tests of lib/keel
        run: python3 -m unittest discover -s tests/unit -t . -v

      - name: Contract tests
        run: python3 -m unittest discover -s tests/contract -v

      # Differential test: lists every agent-gate call whose outcome changed against the base. Intended
      # changes show up here too, so it informs the review instead of failing the build.
      - name: Gate regression test
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tests/gate/run.py --quick --against "${{ github.event.pull_request.base.sha }}"
          else
            python3 tests/gate/run.py --against HEAD~1
          fi
