name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One Linux runner only: macOS minutes bill tenfold. The macOS system python 3.9 and bash 3.2
# are covered locally by the pre-push hook in .githooks/ (git config core.hooksPath .githooks).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocks private data before it is merged: identities, private names, home paths, emails, secrets. The private
  # denylist comes from the secret KEEL_LEAK_DENYLIST; pull requests from forks get the generic rules only.
  # On a push the leak is already public, so the job there only raises the alarm.
  leak-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leak check of the new commits
        env:
          KEEL_LEAK_DENYLIST: ${{ secrets.KEEL_LEAK_DENYLIST }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$KEEL_LEAK_DENYLIST" ]; then unset KEEL_LEAK_DENYLIST; fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            python3 tests/leak_check.py --range "$HEAD"
          else
            python3 tests/leak_check.py --range "$BASE..$HEAD"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version
          git --version

      - name: Git identity for fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      # Three workers fit the GitHub runner; each test method is one job (tests/run.py).
      - name: Unit and contract tests
        run: python3 tests/run.py -j 3 -v

      # Differential test: lists every agent-gate call whose outcome changed against the base. Intended
      # changes show up here too, so it informs the review instead of failing the build. Pull requests only:
      # after the merge nobody reads it, and the full run took over ten minutes.
      # Full run locally: python3 tests/gate/run.py --against main
      - name: Gate regression test
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 tests/gate/run.py --quick --against "${{ github.event.pull_request.base.sha }}"
