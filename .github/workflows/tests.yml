name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One Linux runner only: macOS minutes bill tenfold. The macOS system python 3.9 and bash 3.2
# are covered locally by the pre-push hook in .githooks/ (git config core.hooksPath .githooks).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version
          git --version

      - name: Git identity for fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci

      - name: Unit tests of lib/keel
        run: python3 -m unittest discover -s tests/unit -t . -v

      - name: Contract tests
        run: python3 -m unittest discover -s tests/contract -v

      # Differential test: lists every agent-gate call whose outcome changed against the base. Intended
      # changes show up here too, so it informs the review instead of failing the build.
      - name: Gate regression test
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tests/gate/run.py --quick --against "${{ github.event.pull_request.base.sha }}"
          else
            python3 tests/gate/run.py --against HEAD~1
          fi
